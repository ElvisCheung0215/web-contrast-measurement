<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Camera Contrast</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    min-height: 100vh; min-height: 100dvh;
    background: #111; color: #fff;
    font: 16px -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; flex-direction: column; gap: 14px;
  }
  video {
    width: 100%; max-height: 68vh; object-fit: contain;
    background: #000; border-radius: 12px;
  }
  #value { font-size: clamp(42px, 13vw, 72px); font-weight: 700; line-height: 1; }
  .muted { color: #aaa; font-size: 14px; }
  button {
    border: 0; border-radius: 10px; padding: 14px 18px;
    background: #fff; color: #111; font: inherit; font-weight: 650;
  }
  #status { min-height: 1.2em; }
</style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <div>
    <div class="muted">MAXIMUM CONTRAST (brightest − darkest pixel)</div>
    <div id="value">—</div>
    <div class="muted">Grayscale range, 0–255</div>
  </div>
  <button id="start">Start camera</button>
  <div id="status" class="muted">Allow camera access when Safari asks.</div>
  <canvas id="canvas" hidden></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const value = document.getElementById('value');
const status = document.getElementById('status');
let stream;

document.getElementById('start').addEventListener('click', async () => {
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Camera access needs Safari on HTTPS (or localhost).');
    }
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
    status.textContent = 'Live · measuring the whole frame';
    measure();
  } catch (err) {
    status.textContent = err.message || 'Could not access the camera.';
  }
});

function measure() {
  if (video.readyState >= 2 && video.videoWidth) {
    // Downsample for fast, responsive measurement.
    const w = 160, h = Math.max(1, Math.round(160 * video.videoHeight / video.videoWidth));
    canvas.width = w; canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    const pixels = ctx.getImageData(0, 0, w, h).data;
    let min = 255, max = 0;
    for (let i = 0; i < pixels.length; i += 4) {
      const grey = Math.round(0.299 * pixels[i] + 0.587 * pixels[i+1] + 0.114 * pixels[i+2]);
      if (grey < min) min = grey;
      if (grey > max) max = grey;
    }
    value.textContent = max - min;
  }
  requestAnimationFrame(measure);
}
</script>
</body>
</html>
